[project]
name = "microcoach"
version = "0.1.0"
description = "League of Legends micro-coaching dashboard"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.28",
  "plotly>=5.18",
  "requests>=2.31",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
